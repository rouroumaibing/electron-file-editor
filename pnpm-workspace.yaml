# pnpm 11 工作区/配置清单。
# 单包项目：省略 packages 时仅根包被纳入（等同于普通单包工程）。
# 注意：pnpm 11 已移除 package.json 里的 "pnpm" 字段，所有非鉴权类配置须放在此处或全局 config.yaml。
# 见 docs/electron-file-editor-design.md §11.3「pnpm 构建脚本审批」。

# 构建脚本白名单：显式允许以下依赖执行其 install/postinstall，
# 否则 pnpm 默认拦截（strictDepBuilds=true）并报 ERR_PNPM_IGNORED_BUILDS、exit 1。
# electron 需下载平台二进制；esbuild 需安装 native 二进制。
# electron-winstaller 为 Windows 平台专用（Squirrel.Windows），macOS 开发机不需要，显式 false。
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true

# 依赖覆盖：electron-builder 26.15.3 声明 @electron/get ^3.0.0，但其新增的 cache-mode
# 功能引用 ElectronDownloadCacheMode（仅 @electron/get 5.x 存在），3.0.0 下运行会崩
# （Cannot read properties of undefined (reading 'ReadWrite')）。
# electron@44 本身已用 5.1.0，此处仅强制 app-builder-lib 对齐，见设计文档 §12.1。
# 语法：pnpm 11 overrides 只接受字符串值，用 parent>child selector 精确指定。
overrides:
  'app-builder-lib@26.15.3>@electron/get': 5.1.0
