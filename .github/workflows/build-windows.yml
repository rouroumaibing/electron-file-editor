# Windows 构建 workflow（发布链路 L2b 层，见 docs/ci-release-pipeline.md）
#
# 仅通过 workflow_call 被 release-desktop.yml 调用（不单独触发）。
#
# 架构：单 job 双架构（x64 + arm64，NSIS 安装包），由 scripts/dist.mjs 默认行为产出。
#
# 签名策略：
#   有 WIN_CERTIFICATE_BASE64（GitHub Secrets）→ 通过 CSC_LINK 通道交给
#   electron-builder 自动调用 signtool 对 exe 与安装包签名；
#   无证书 → 产出未签名安装包（SmartScreen 提示未知发布者，属预期降级）。
#
# 完整性：verify-artifacts 校验命名 + 生成 SHA256SUMS.win；
#         attest-build-provenance 提供构建来源证明（OIDC，免费）。
#
# 分发：release.published 触发时 attach 到 release；手动 dry-run 只留 workflow artifact。

name: build-windows

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
        description: 注入的版本号（无 v 前缀，来自 release tag 或手动输入）
      upload-to-release:
        type: boolean
        required: true
        description: release.published 触发时为 true（attach 到 release）；手动 dry-run 为 false（仅产 artifact）
      release-tag:
        type: string
        required: false
        default: ''
        description: 目标 release 的 tag（attach 用；dry-run 时为空）
    # secrets 不在此声明：调用方（release-desktop.yml）用 secrets: inherit 全量透传，
    # 本 workflow 直接以 ${{ secrets.* }} 访问（WIN_CERTIFICATE_BASE64 等，见文件头注释）。

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 打包前统一过质量门禁（tsc + eslint）
      - run: pnpm check

      - name: Build & package (NSIS, x64 + arm64)
        env:
          # 有证书时 electron-builder 自动调用 signtool；无证书留空 → 未签名安装包
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE_BASE64 != '' && format('data:application/x-pkcs12;base64,{0}', secrets.WIN_CERTIFICATE_BASE64) || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: pnpm dist:win --version ${{ inputs.version }}

      # 命名校验 + 生成 SHA256SUMS.win（fail-closed：任一步失败即红）
      - name: Verify artifacts & generate SHA256SUMS
        run: node scripts/verify-artifacts.mjs --platform win --version ${{ inputs.version }} --dir dist/win --out dist/win/SHA256SUMS.win

      # 构建来源证明（OIDC）
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/win/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: file-editor-windows
          path: |
            dist/win/*.exe
            dist/win/SHA256SUMS.win
          if-no-files-found: error

      # release.published 触发才 attach；手动 dry-run 只留 artifact
      - name: Attach to release
        if: inputs.upload-to-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-tag }}
          files: |
            dist/win/*.exe
            dist/win/SHA256SUMS.win
